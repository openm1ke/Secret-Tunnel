name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: python3 benchmarks/ssh-transport/test_bridge.py
      - run: cargo test --manifest-path routing-engine/Cargo.toml --locked
      - run: cargo test --manifest-path session-control/Cargo.toml --locked
      - run: cargo test --manifest-path stream-mux/Cargo.toml --locked
      - run: cargo test --locked
        working-directory: src-tauri
      - run: cargo test --features embedded-ssh --locked
        working-directory: src-tauri
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - run: python3 scripts/check-macos-redirect.py src-tauri/target/debug/secret-tunnel
      - run: cargo test --manifest-path udp-agent/Cargo.toml --locked
      - run: cargo build --manifest-path udp-agent/Cargo.toml --locked
      - run: python3 udp-agent/test_echo.py udp-agent/target/debug/secret-tunnel-agent

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install nasm -y --no-progress
      - shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\NASM;$env:PATH"
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/ssh-transport/test_bridge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path src-tauri/Cargo.toml --features embedded-ssh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --features embedded-ssh --lib --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path routing-engine/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path session-control/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path stream-mux/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path udp-agent/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path udp-agent/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python udp-agent/test_echo.py udp-agent/target/debug/secret-tunnel-agent.exe
