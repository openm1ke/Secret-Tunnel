<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Secret Tunnel">
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#174752"/>
      <stop offset="1" stop-color="#0b232b"/>
    </linearGradient>
    <radialGradient id="st-light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#f2a541" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2a541" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#st-bg)"/>
  <!-- The tunnel mouth: three arches that recede toward the exit. -->
  <path d="M100 404 V258 A156 156 0 0 1 412 258 V404" fill="none" stroke="#1fb3a6" stroke-width="38" stroke-linecap="round"/>
  <path d="M164 404 V282 A92 92 0 0 1 348 282 V404" fill="none" stroke="#14928a" stroke-width="30" stroke-linecap="round"/>
  <path d="M216 404 V304 A40 40 0 0 1 296 304 V404" fill="none" stroke="#0f706c" stroke-width="22" stroke-linecap="round"/>
  <!-- The exit: light at the far end. -->
  <circle cx="256" cy="330" r="62" fill="url(#st-light)"/>
  <circle cx="256" cy="330" r="17" fill="#ffc463"/>
</svg>
