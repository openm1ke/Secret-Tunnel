[package]
name = "secret-tunnel-hosting-catalog"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["net", "rt", "time", "macros", "sync"] }
url = "2"
