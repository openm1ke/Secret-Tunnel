[package]
name = "secret-tunnel-ios"
version = "0.1.0"
edition = "2021"

[lib]
name = "secret_tunnel_ios"
crate-type = ["staticlib", "rlib"]

[dependencies]
secret-tunnel-core = { path = "../../tunnel-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "unwind"
