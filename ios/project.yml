# XcodeGen spec for the native iOS client (app + Packet Tunnel extension).
# Generate with scripts/build-ios.sh; bundle IDs and team come from the environment:
#   ST_BUNDLE_PREFIX (default dev.secrettunnel), ST_DEVELOPMENT_TEAM (Apple Team ID).
name: SecretTunnelIOS
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.3.14
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ${ST_DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ST_BUNDLE_PREFIX: ${ST_BUNDLE_PREFIX}
    ST_APP_BUNDLE_ID: $(ST_BUNDLE_PREFIX).ios
    ST_TUNNEL_BUNDLE_ID: $(ST_BUNDLE_PREFIX).ios.PacketTunnel
    ST_APP_GROUP: group.$(ST_BUNDLE_PREFIX).ios
    HEADER_SEARCH_PATHS: $(PROJECT_DIR)/native/include $(PROJECT_DIR)/build/include
    LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(PROJECT_DIR)/build/lib/iphoneos
    LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(PROJECT_DIR)/build/lib/iphonesimulator
    OTHER_LDFLAGS: -lsecret_tunnel_ios -lresolv
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ENABLE_BITCODE: false
    DEAD_CODE_STRIPPING: true
targets:
  SecretTunnel:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Secret Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        STAppGroup: $(ST_APP_GROUP)
        STTunnelBundleID: $(ST_TUNNEL_BUNDLE_ID)
    entitlements:
      path: App/SecretTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(ST_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ST_APP_BUNDLE_ID)
        PRODUCT_NAME: SecretTunnel
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: App/SecretTunnel-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: PacketTunnel
        embed: true
      - sdk: NetworkExtension.framework
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Secret Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
        STAppGroup: $(ST_APP_GROUP)
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(ST_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ST_TUNNEL_BUNDLE_ID)
        PRODUCT_NAME: PacketTunnel
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/PacketTunnel-Bridging-Header.h
        OTHER_LDFLAGS: -lsecret_tunnel_ios -lhev-socks5-tunnel -lresolv
    dependencies:
      - sdk: NetworkExtension.framework
