[package]
name = "secret-tunnel"
version = "0.3.27"
description = "Desktop SSH SOCKS tunnel manager"
authors = ["Secret Tunnel contributors"]
edition = "2021"

[features]
default = []
embedded-ssh = ["dep:russh", "dep:tokio", "dep:secret-tunnel-mux"]
macos-discord-udp-test = ["embedded-ssh"]

[lib]
name = "secret_tunnel_lib"
# Desktop is linked into a Rust executable. Android JNI has its own crate.
# iOS (Tauri mobile) links the static library into the Xcode app.
crate-type = ["staticlib", "rlib"]

[[example]]
name = "check_embedded"
required-features = ["embedded-ssh"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
secret-tunnel-session-control = { path = "../session-control" }
secret-tunnel-mux = { path = "../stream-mux", optional = true }
secret-tunnel-routing = { path = "../routing-engine" }
russh = { version = "0.61", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time", "macros"], optional = true }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
plist = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
