[package]
name = "secret-tunnel"
version = "0.3.3"
description = "Desktop SSH SOCKS tunnel manager"
authors = ["Secret Tunnel contributors"]
edition = "2021"

[features]
default = []
embedded-ssh = ["dep:russh", "dep:tokio", "dep:secret-tunnel-mux"]

[lib]
name = "secret_tunnel_lib"
# Desktop is linked into a Rust executable. Android JNI has its own crate.
crate-type = ["rlib"]

[[example]]
name = "check_embedded"
required-features = ["embedded-ssh"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
secret-tunnel-session-control = { path = "../session-control" }
secret-tunnel-mux = { path = "../stream-mux", optional = true }
secret-tunnel-routing = { path = "../routing-engine" }
russh = { version = "0.61", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time", "macros"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
plist = "1"
