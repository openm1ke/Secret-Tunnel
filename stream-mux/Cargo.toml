[package]
name = "secret-tunnel-mux"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "rt", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
