[package]
name = "secret-tunnel-core"
version = "0.1.0"
edition = "2021"

[dependencies]
secret-tunnel-mux = { path = "../stream-mux" }
russh = { version = "=0.61.2", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time", "macros"] }

[profile.release]
strip = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }
