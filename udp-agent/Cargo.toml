[package]
name = "secret-tunnel-agent"
version = "0.3.18"
edition = "2021"

[dependencies]
serde_json = "1"
secret-tunnel-mux = { path = "../stream-mux" }
tokio = { version = "1", features = ["io-util", "io-std", "net", "rt", "macros", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["process", "rt-multi-thread"] }
